name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --pre psycopg psycopg_pool mariadb mariadb-pool
      - name: Start MariaDB (case-insensitive tables, ANSI_QUOTES)
        run: |
          docker run -d --name mariadb -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD=root \
            -e MARIADB_DATABASE=pony_mariadb_test \
            -e MARIADB_USER=ponytest \
            -e MARIADB_PASSWORD=ponytest \
            mariadb:11 \
            --lower-case-table-names=1 \
            --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,ANSI_QUOTES
          for i in $(seq 1 60); do
            docker exec mariadb mariadb -uroot -proot -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
      - name: Create async test database
        run: |
          python -c "
          import psycopg
          conn = psycopg.connect('dbname=postgres user=postgres password=postgres host=localhost')
          conn.autocommit = True
          conn.cursor().execute('CREATE DATABASE pony_async_test')
          conn.close()"
      - name: Run test suites
        env:
          PONY_ASYNC_DSN: "dbname=pony_async_test user=postgres password=postgres host=localhost"
          PONY_MARIADB_HOST: "127.0.0.1"
          PONY_MARIADB_PORT: "3306"
          PONY_MARIADB_USER: "ponytest"
          PONY_MARIADB_PASSWORD: "ponytest"
          PONY_MARIADB_DB: "pony_mariadb_test"
        run: |
          python -m unittest discover -s pony/orm/tests -p 'test_*.py'
          python -m unittest discover -s pony/utils/tests -p 'test_*.py'
